  <path class="h5" d="M25.972 27.472A15.2 15.2 0 0 1 20.949 30.372L19.256 25.455A10 10 0 0 0 22.561 23.547Z"/>
  <path class="h6" d="M18.9 30.921A15.2 15.2 0 0 1 13.1 30.921L14.092 25.816A10 10 0 0 0 17.908 25.816Z"/>
