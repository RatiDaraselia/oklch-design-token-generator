<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OKLCH colour wheel">
  <title>OKLCH Color Generator</title>
  <style>
    /* Twelve hues swept at a fixed OKLCH lightness, each at 92% of the chroma
       that still fits sRGB at that lightness — the same fixed-L / max-C rule the
       generator itself uses, so the mark is a sample of its own output.
       L .60 is the crossover that clears 3.7:1 on white *and* on #1b1b1b, so the
       icon stays readable even where prefers-color-scheme is ignored. */
.h0{fill:#e0257b}.h1{fill:#e72d1c}.h2{fill:#b76b1d}.h3{fill:#9a7c1d}.h4{fill:#778b1e}.h5{fill:#22984c}.h6{fill:#229382}.h7{fill:#228fa0}.h8{fill:#2189c4}.h9{fill:#5471f5}.h10{fill:#994df5}.h11{fill:#cb26c5}
    @media (prefers-color-scheme: dark) {
      /* Nothing sits behind the spokes on a dark tab strip, so lightness can go
         up to .74 for a richer mark without risking the light-mode case. */
.h0{fill:#f97ba7}.h1{fill:#f98472}.h2{fill:#f28f2a}.h3{fill:#cda62a}.h4{fill:#9eb92b}.h5{fill:#31ca67}.h6{fill:#31c4ae}.h7{fill:#30bfd4}.h8{fill:#49b5f8}.h9{fill:#8da6f9}.h10{fill:#b994f9}.h11{fill:#f964f1}
    }
  </style>
